# Machine description for the Zesu SSZ decoder binary.
#
# Start from islaris-tutorial's riscv64_tutorial.toml and adjust for the
# exact extensions and privilege mode Zesu uses.
#
# TODO: verify these values against the actual Zesu build configuration.
#   - misa.bits: must match the extensions the binary was compiled for.
#     0x800000000015312d enables rv64imafdc. If Zesu is rv64im only,
#     clear the A, F, D, C bits.
#   - The MPRV constraint: verify mstatus layout for the Zesu runtime.

pc = "PC"

# No ifetch semantics for RISC-V
ifetch = false

[registers.reset]
# TODO: set misa.bits to match the Zesu build's -mcpu flag.
# The value below is from islaris-tutorial (rv64im + Zicsr + Zifencei).
"misa.bits" = "0x800000000015312d"
cur_privilege = "Machine"

[constraints]
# MPRV = 0: physical addressing, no virtual memory indirection.
reset = [ "= (bvand mstatus.bits 0x0000000000020000) 0x0000000000000000" ]
